<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Isle - Kill-Tracker</title>
  
  <!-- Verknüpfung für die Browser-Installation (PWA / App-Icon) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16110d">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: rgba(22, 17, 13, 0.94);
      --card-bg: rgba(16, 12, 9, 0.96);
      --border-subtle: #4a3d30;
      --text-main: #e6eae7;
      --text-muted: #9c9183;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 40px 20px 30px 20px;
      background-color: #0c0e0d;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .fossil-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
    }

    /* Knochen- / Fossil-Rahmen */
    .bone-frame {
      position: relative;
      background: linear-gradient(145deg, #dfd4be 0%, #bfb092 45%, #99896c 100%);
      padding: 26px;
      border-radius: 24px;
      box-shadow: 
        0 0 0 3px #4a4132,
        inset 0 2px 4px rgba(255, 250, 240, 0.65),
        inset 0 -3px 7px rgba(45, 38, 28, 0.8),
        0 18px 40px rgba(0, 0, 0, 0.9);
    }

    /* Eingestanzte Skelett-Muster am Rahmen */
    .frame-pattern-layer {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .frame-strip {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: space-around;
      opacity: 0.85;
    }

    .strip-top { top: 3px; left: 26px; right: 26px; height: 20px; }
    .motif-rex-top { width: 52px; height: 20px; filter: drop-shadow(0 1px 0 rgba(255, 250, 240, 0.45)); }

    .strip-bottom { bottom: 3px; left: 26px; right: 26px; height: 20px; flex-direction: row-reverse; }
    .motif-rex-bottom { width: 52px; height: 20px; transform: scaleX(-1); filter: drop-shadow(0 1px 0 rgba(255, 250, 240, 0.45)); }

    .strip-left { top: 26px; bottom: 26px; left: 3px; width: 20px; flex-direction: column-reverse; }
    .motif-rex-left { width: 20px; height: 52px; filter: drop-shadow(1px 0 0 rgba(255, 250, 240, 0.45)); }

    .strip-right { top: 26px; bottom: 26px; right: 3px; width: 20px; flex-direction: column; }
    .motif-rex-right { width: 20px; height: 52px; filter: drop-shadow(1px 0 0 rgba(255, 250, 240, 0.45)); }

    /* Innerer Tracker Inhalt */
    .tracker-app {
      position: relative;
      z-index: 10;
      background: 
        linear-gradient(rgba(20, 15, 11, 0.88), rgba(15, 11, 8, 0.94)),
        radial-gradient(circle at 50% 30%, #423222 0%, #1a130e 80%);
      border: 2px solid #4a3d30;
      border-radius: 14px;
      padding: 16px 18px;
      overflow: hidden;
      box-shadow: 
        0 0 0 1px rgba(255, 248, 231, 0.15),
        inset 0 0 25px rgba(0, 0, 0, 0.85);
    }

    /* Großes T-Rex Hintergrund-Fossil (dauerhaft aktiv) */
    .bg-fossil-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
    }

    .bg-fossil-img {
      width: 110%;
      height: 110%;
      object-fit: contain;
      transform: translateX(12px);
      filter: sepia(1) hue-rotate(-20deg) brightness(1.2);
    }

    .top-bar, .score-card, .grid-header, .dino-grid, .footer-bar {
      position: relative;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #5ec985;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Solo/Duo Switcher */
    .mode-switch {
      display: flex;
      background: #15110d;
      border: 1px solid #362c22;
      border-radius: 8px;
      padding: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: #362c22;
      color: #f4f1ea;
    }

    /* Oberer Bereich transparent */
    .score-card {
      background: rgba(16, 12, 9, 0.35);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(74, 61, 48, 0.6);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .duo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(45, 36, 27, 0.6);
      margin-bottom: 12px;
      gap: 10px;
    }

    .duo-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .duo-badge {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 7px;
      background: rgba(214, 79, 73, 0.14);
      border: 1px solid rgba(214, 79, 73, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d64f49;
    }

    .duo-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .duo-title {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.6px;
      color: #f0ece1;
      user-select: text;
      cursor: text;
      padding: 3px 7px;
      margin: -3px -7px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .duo-title:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: #483b2d;
    }

    .duo-title:focus {
      background: #231b14;
      border-color: #dfd4be;
      white-space: normal;
      overflow: visible;
    }

    .edit-name-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      opacity: 0.6;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }

    .duo-header:hover .edit-name-btn { opacity: 1; }
    .edit-name-btn:hover { color: #f0ece1; background: rgba(255, 255, 255, 0.07); }

    /* Gespielter Dino Dropdown (blockiert auf Rex) */
    .player-dino-select {
      background: rgba(21, 17, 13, 0.8);
      border: 1px solid #362c22;
      color: #d4a373;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 8px;
      outline: none;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .score-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .total-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      color: #f4f1ea;
    }

    .tier-box {
      background: rgba(21, 17, 13, 0.8);
      border: 1px solid #362c22;
      border-radius: 9px;
      padding: 8px 12px;
      min-width: 128px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tier-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
    }

    .tier-name { display: flex; align-items: center; gap: 6px; }
    .dot-apex { color: #e05a54; }
    .dot-mittel { color: #e0a938; }
    .dot-klein { color: #43b574; }
    .tier-val { color: var(--text-main); }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .grid-title { font-weight: 700; color: #b7beb9; letter-spacing: 0.6px; }
    .grid-hint { color: var(--text-muted); font-size: 10.5px; }

    .dino-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    /* HORIZONTALER BERNSTEIN-BUTTON */
    .dino-btn {
      position: relative;
      background: transparent;
      border: none;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: visible;
      transition: transform 0.08s ease;
      margin-top: 22px;
    }

    .amber-img-wrap {
      position: relative;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7));
    }

    .amber-stone-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      transition: filter 0.2s ease;
    }

    .amber-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    /* Fossil-Inklusion im Bernstein */
    .fossil-img {
      width: 78%;
      height: 65%;
      object-fit: contain;
      filter: brightness(0.05) contrast(2.2) drop-shadow(0 1px 1px rgba(255, 204, 51, 0.6));
      opacity: 0.95;
    }

    .fossil-img-deino {
      width: 72% !important;
      height: 60% !important;
      filter: brightness(0.05) contrast(2.2) drop-shadow(0 1px 1px rgba(255, 204, 51, 0.6)) !important;
    }

    .dino-btn:hover .amber-stone-img {
      filter: brightness(1.2) drop-shadow(0 0 8px rgba(255, 183, 0, 0.7));
    }
    .dino-btn:active { transform: scale(0.95); }

    .tier-dot-corner {
      position: absolute;
      top: -16px;
      left: 3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 4;
    }

    .kill-badge {
      position: absolute;
      top: -20px;
      right: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: #ffe599;
      background: rgba(20, 10, 3, 0.95);
      border: 1px solid rgba(212, 143, 56, 0.7);
      padding: 1px 5px;
      border-radius: 4px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
      z-index: 4;
      display: none;
    }

    .dino-btn.has-kills .kill-badge { display: block; }
    
    .amber-tag {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 0.8px;
      background: linear-gradient(145deg, #2c2219 0%, #17110c 100%);
      border: 1.5px solid #5c4938;
      padding: 1px 6px;
      border-radius: 5px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.15);
      z-index: 5;
      white-space: nowrap;
      pointer-events: none;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .log-text { font-size: 12px; font-style: italic; color: var(--text-muted); }
    .footer-actions { display: flex; gap: 8px; }

    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(145deg, #33271d 0%, #1e150f 100%);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .circle-btn:hover { background: linear-gradient(145deg, #423528 0%, #2b2018 100%); color: var(--text-main); border-color: #d4a373; }
    .circle-btn.sound-active { color: #f4b41a; border-color: rgba(244, 180, 26, 0.45); box-shadow: 0 0 8px rgba(244, 180, 26, 0.2); }
    
    .circle-btn.copy-btn { color: #ffd000; border-color: rgba(255, 208, 0, 0.4); }
    .circle-btn.copy-btn:hover { background: rgba(255, 208, 0, 0.15); border-color: #ffd000; color: #ffe566; }

    .circle-btn.reset-btn { color: #e05a54; border-color: rgba(224, 90, 84, 0.35); }
    .circle-btn.reset-btn:hover { background: rgba(224, 90, 84, 0.15); }
  </style>
</head>
<body>

<svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
  <symbol id="rex-skeleton" viewBox="0 0 120 48">
    <g fill="#2b241b">
      <path d="M4,12 C2,8 6,3 14,3 C20,3 24,5 25,9 L21,12 L15,12 L14,15 L22,16 L20,21 C14,22 8,20 6,16 L11,16 L11,14 L4,14 Z"/>
      <path d="M24,7 L28,6 L28,10 L32,8 L32,12 L36,9 L36,13 L40,10 L40,14 L45,10 L45,14 L50,10 L50,14 L55,10 L55,14 L60,10 L60,14 L66,11 L66,14 L72,12 L72,14 L78,12 L78,14 L84,13 L84,15 L90,13 L90,15 L96,14 L96,15 L103,14 L118,16 L103,16 L60,16 L25,13 Z"/>
      <path d="M28,13 Q26,18 29,21 M31,13 Q29,20 32,23 M34,13 Q32,22 36,26 M38,14 Q36,24 40,28 M42,14 Q40,25 44,29 M46,14 Q44,24 48,28 M50,14 Q48,23 51,26" stroke="#2b241b" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M68,16 L67,20 M73,16 L72,20 M78,16 L77,20 M83,16 L82,19 M88,16 L87,19 M93,16 L92,18 M98,16 L97,18" stroke="#2b241b" stroke-width="1.1" fill="none"/>
      <path d="M26,15 L23,19 L19,19 M23,19 L20,21" stroke="#2b241b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M51,14 L62,14 L61,20 L55,22 L52,18 Z"/>
      <path d="M55,19 L49,28 L51,37 L44,43 L48,43 L52,39 L55,42 L53,37 L52,28 L57,20 Z"/>
      <path d="M59,19 L64,28 L69,36 L63,41 L67,41 L71,37 L73,40 L71,36 L67,27 L61,19 Z"/>
    </g>
  </symbol>
</svg>

<div class="fossil-wrapper">
  <div class="bone-frame">
    <div class="frame-pattern-layer">
      <div class="frame-strip strip-top">
        <svg class="motif-rex-top"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-top"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-top"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-top"><use href="#rex-skeleton"/></svg>
      </div>

      <div class="frame-strip strip-right">
        <svg class="motif-rex-right" viewBox="0 0 48 120"><g transform="translate(48, 0) rotate(90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-right" viewBox="0 0 48 120"><g transform="translate(48, 0) rotate(90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-right" viewBox="0 0 48 120"><g transform="translate(48, 0) rotate(90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-right" viewBox="0 0 48 120"><g transform="translate(48, 0) rotate(90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-right" viewBox="0 0 48 120"><g transform="translate(48, 0) rotate(90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
      </div>

      <div class="frame-strip strip-bottom">
        <svg class="motif-rex-bottom"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-bottom"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-bottom"><use href="#rex-skeleton"/></svg>
        <svg class="motif-rex-bottom"><use href="#rex-skeleton"/></svg>
      </div>

      <div class="frame-strip strip-left">
        <svg class="motif-rex-left" viewBox="0 0 48 120"><g transform="translate(0, 120) rotate(-90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-left" viewBox="0 0 48 120"><g transform="translate(0, 120) rotate(-90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-left" viewBox="0 0 48 120"><g transform="translate(0, 120) rotate(-90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-left" viewBox="0 0 48 120"><g transform="translate(0, 120) rotate(-90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
        <svg class="motif-rex-left" viewBox="0 0 48 120"><g transform="translate(0, 120) rotate(-90)"><use href="#rex-skeleton" width="120" height="48"/></g></svg>
      </div>
    </div>

    <div class="tracker-app">
      <!-- Großes T-Rex Hintergrund-Fossil (dauerhaft aktiv) -->
      <div class="bg-fossil-layer" id="bg-fossil">
        <img src="t-rex_background.png" class="bg-fossil-img" alt="T-Rex Background Fossil">
      </div>

      <div class="top-bar">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="mode-label">WIDGET-MODUS (DUO)</span>
        </div>
        <div class="mode-switch">
          <button class="mode-btn" id="btn-solo" onclick="setGameMode('solo')">Solo</button>
          <button class="mode-btn active" id="btn-duo" onclick="setGameMode('duo')">Duo</button>
        </div>
      </div>

      <div class="score-card">
        <div class="duo-header">
          <div class="duo-header-left">
            <div class="duo-badge">
              <svg width="16" height="16" viewBox="0 0 32 20" fill="currentColor">
                <path d="M26,4 C28,4 30,5 30,7 C30,8 28,9 26,9 L23,9 L21,13 L23,18 L20,18 L18,14 L14,14 L12,18 L9,18 L11,13 L3,15 L1,13 L11,9 C14,6 20,4 26,4 Z"/>
              </svg>
            </div>
            <div class="duo-title-wrap">
              <span class="duo-title" id="duo-title" contenteditable="true" spellcheck="false" title="Klicken zum Bearbeiten">Name &amp; Name</span>
              <button class="edit-name-btn" onclick="focusDuoTitle()" title="Namen bearbeiten">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </button>
            </div>
          </div>
          <div>
            <!-- Dropdown auf Rex blockiert -->
            <select class="player-dino-select" id="player-dino" disabled title="Fester Rex-Modus">
              <option value="Rex">Als: Rex</option>
            </select>
          </div>
        </div>

        <div class="score-body">
          <div>
            <div class="total-section-label" id="total-label">GEMEINSAME KILLS</div>
            <div class="total-number" id="total-kills">0</div>
          </div>

          <div class="tier-box">
            <div class="tier-row">
              <span class="tier-name dot-apex">● APEX</span>
              <span class="tier-val" id="count-apex">0</span>
            </div>
            <div class="tier-row">
              <span class="tier-name dot-mittel">● MITTEL</span>
              <span class="tier-val" id="count-mittel">0</span>
            </div>
            <div class="tier-row">
              <span class="tier-name dot-klein">● KLEIN</span>
              <span class="tier-val" id="count-klein">0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-header">
        <span class="grid-title">BEUTE ANTIPPEN (+1 KILL)</span>
        <span class="grid-hint">Rechtsklick: -1 · [Z]: Undo</span>
      </div>

      <div class="dino-grid" id="dino-grid"></div>

      <div class="footer-bar">
        <span class="log-text" id="status-log">Bereit für die Jagd...</span>
        <div class="footer-actions">
          <button class="circle-btn copy-btn" onclick="copyDinoList()" title="Kill-Liste für Discord kopieren">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </button>
          <button class="circle-btn" onclick="undoLast()" title="Rückgängig [Z]">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
            </svg>
          </button>
          <button class="circle-btn sound-active" id="sound-btn" onclick="toggleSound()" title="Sound umschalten">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          <button class="circle-btn reset-btn" onclick="resetTracker()" title="Alle Kills zurücksetzen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const DINOS = [
    { id: 'rex',    name: 'Rex',       tier: 'apex',   color: '#ff8a8a' },
    { id: 'trike',  name: 'Trike',     tier: 'apex',   color: '#ffd25a' },
    { id: 'stego',  name: 'Stego',     tier: 'apex',   color: '#73e2a7' },
    { id: 'deino',  name: 'Deino',     tier: 'apex',   color: '#70c1ff' },
    { id: 'diablo', name: 'Diablo',    tier: 'mittel', color: '#b5ff48' },
    { id: 'carno',  name: 'Carno',     tier: 'mittel', color: '#ffa05c' },
    { id: 'cera',   name: 'Cera',      tier: 'mittel', color: '#ff8a8a' },
    { id: 'allo',   name: 'Allo',      tier: 'mittel', color: '#ffcc80' },
    { id: 'maia',   name: 'Maia',      tier: 'mittel', color: '#6eb5ff' },
    { id: 'tenonto',name: 'Tenonto',   tier: 'klein',  color: '#84e6ff' },
    { id: 'omni',   name: 'Omni',      tier: 'klein',  color: '#c784ff' },
    { id: 'dilo',   name: 'Dilo/Herr', tier: 'klein',  color: '#ccff48' },
    { id: 'juvi',   name: 'Juvi/Egg',  tier: 'klein',  color: '#c784ff' }
  ];

  const TIER_DOT_COLORS = {
    apex: '#e05a54',
    mittel: '#e0a938',
    klein: '#43b574'
  };

  let state = {
    mode: 'duo',
    playerDino: 'Rex',
    kills: {},
    history: [],
    sound: true,
    duoTitle: 'Name & Name',
    soloTitle: 'Name'
  };

  DINOS.forEach(d => state.kills[d.id] = 0);

  function init() {
    setupTitleEditor();
    localStorage.removeItem('rex_duo_tracker_clean_v1');
    renderGrid();
    updateUI();
  }

  function setGameMode(mode) {
    const titleEl = document.getElementById('duo-title');
    if (state.mode === 'duo') {
      state.duoTitle = titleEl.textContent.trim() || 'Name & Name';
    } else {
      state.soloTitle = titleEl.textContent.trim() || 'Name';
    }

    state.mode = mode;
    document.getElementById('btn-solo').classList.toggle('active', mode === 'solo');
    document.getElementById('btn-duo').classList.toggle('active', mode === 'duo');
    document.getElementById('mode-label').textContent = `WIDGET-MODUS (${mode.toUpperCase()})`;
    document.getElementById('total-label').textContent = mode === 'solo' ? 'SOLO KILLS' : 'GEMEINSAME KILLS';
    
    titleEl.textContent = mode === 'solo' ? state.soloTitle : state.duoTitle;
    setLog(`Modus gewechselt: ${mode.toUpperCase()}`);
  }

  function setupTitleEditor() {
    const titleEl = document.getElementById('duo-title');
    titleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        titleEl.blur();
      }
    });

    titleEl.addEventListener('blur', () => {
      const cleanName = titleEl.textContent.trim().replace(/\s+/g, ' ');
      if (state.mode === 'solo') {
        state.soloTitle = cleanName || 'Name';
        titleEl.textContent = state.soloTitle;
        setLog(`Solo-Name gespeichert: ${state.soloTitle}`);
      } else {
        state.duoTitle = cleanName || 'Name & Name';
        titleEl.textContent = state.duoTitle;
        setLog(`Duo-Namen gespeichert: ${state.duoTitle}`);
      }
    });
  }

  function focusDuoTitle() {
    const titleEl = document.getElementById('duo-title');
    titleEl.focus();
    const range = document.createRange();
    range.selectNodeContents(titleEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function renderGrid() {
    const grid = document.getElementById('dino-grid');
    grid.innerHTML = '';

    DINOS.forEach(dino => {
      const btn = document.createElement('button');
      btn.className = 'dino-btn';
      btn.id = `btn-${dino.id}`;
      
      let fossilHtml = '';
      if (dino.id === 'rex') {
        fossilHtml = `<img src="t-rex_skull.png" class="fossil-img" alt="T-Rex Fossil">`;
      } else if (dino.id === 'trike') {
        fossilHtml = `<img src="trike_skull.png" class="fossil-img" alt="Trike Fossil">`;
      } else if (dino.id === 'stego') {
        fossilHtml = `<img src="stego_skull.png" class="fossil-img" alt="Stego Fossil">`;
      } else if (dino.id === 'deino') {
        fossilHtml = `<img src="deino_skull.png" class="fossil-img fossil-img-deino" alt="Deino Fossil">`;
      } else {
        fossilHtml = `<span class="dino-name" style="color: ${dino.color};">${dino.name}</span>`;
      }

      btn.innerHTML = `
        <span class="tier-dot-corner" style="background:${TIER_DOT_COLORS[dino.tier]}"></span>
        <span class="kill-badge" id="badge-${dino.id}">0</span>
        <span class="amber-tag" style="color: ${dino.color};">${dino.name}</span>
        <div class="amber-img-wrap">
          <img src="amber-stone.png" class="amber-stone-img" alt="Amber">
          <div class="amber-content">
            ${fossilHtml}
          </div>
        </div>
      `;

      btn.addEventListener('click', () => addKill(dino.id, 1));
      btn.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        addKill(dino.id, -1);
      });

      grid.appendChild(btn);
    });
  }

  function addKill(dinoId, delta) {
    if (delta < 0 && (state.kills[dinoId] || 0) <= 0) return;

    state.kills[dinoId] = Math.max(0, (state.kills[dinoId] || 0) + delta);
    state.history.push({ dinoId, delta });

    const dino = DINOS.find(d => d.id === dinoId);
    setLog(delta > 0 ? `+1 ${dino.name} erlegt!` : `-1 ${dino.name} korrigiert`);

    if (state.sound) playClickSound(delta > 0 ? 520 : 280);
    updateUI();
  }

  function undoLast() {
    if (state.history.length === 0) return;
    const last = state.history.pop();
    state.kills[last.dinoId] = Math.max(0, (state.kills[last.dinoId] || 0) - last.delta);
    const dino = DINOS.find(d => d.id === last.dinoId);
    setLog(`Rückgängig: ${dino.name}`);
    if (state.sound) playClickSound(340);
    updateUI();
  }

  function resetTracker() {
    DINOS.forEach(d => state.kills[d.id] = 0);
    state.history = [];
    setLog('Tracker zurückgesetzt.');
    updateUI();
  }

  function updateUI() {
    let total = 0;
    let apex = 0, mittel = 0, klein = 0;

    DINOS.forEach(d => {
      const count = state.kills[d.id] || 0;
      total += count;
      if (d.tier === 'apex') apex += count;
      if (d.tier === 'mittel') mittel += count;
      if (d.tier === 'klein') klein += count;

      const btn = document.getElementById(`btn-${d.id}`);
      const badge = document.getElementById(`badge-${d.id}`);

      if (btn && badge) {
        badge.textContent = count;
        btn.classList.toggle('has-kills', count > 0);
      }
    });

    document.getElementById('total-kills').textContent = total;
    document.getElementById('count-apex').textContent = apex;
    document.getElementById('count-mittel').textContent = mittel;
    document.getElementById('count-klein').textContent = klein;

    const titleEl = document.getElementById('duo-title');
    const activeCurrentTitle = state.mode === 'solo' ? state.soloTitle : state.duoTitle;
    if (document.activeElement !== titleEl && titleEl.textContent !== activeCurrentTitle) {
      titleEl.textContent = activeCurrentTitle;
    }

    const soundBtn = document.getElementById('sound-btn');
    soundBtn.classList.toggle('sound-active', state.sound);
  }

  function setLog(msg) {
    document.getElementById('status-log').textContent = msg;
  }

  function toggleSound() {
    state.sound = !state.sound;
    updateUI();
  }

  function copyDinoList() {
    let total = document.getElementById('total-kills').textContent;
    let activeDinosText = '';

    DINOS.forEach(d => {
      let count = state.kills[d.id] || 0;
      if (count > 0) {
        activeDinosText += `• ${d.name}: ${count}\n`;
      }
    });

    if (activeDinosText === '') {
      activeDinosText = '• Noch keine Kills verzeichnet\n';
    }

    let currentName = document.getElementById('duo-title').textContent.trim();
    let modeTitle = state.mode === 'solo' 
      ? `Solo [${currentName}] — Gespielt als: Rex` 
      : `Duo [${currentName}] — Gespielt als: Rex`;
      
    let headerLabel = state.mode === 'solo' ? 'Solo Kills' : 'Gemeinsame Kills';

    let discordOutput = `:t_rex: **The Isle Kill-Tracker (${modeTitle})** :t_rex:\n\n${headerLabel}: **${total}**\n----------------------------\n${activeDinosText}`;

    const textarea = document.createElement('textarea');
    textarea.value = discordOutput;
    textarea.style.position = 'fixed';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    try {
      const successful = document.execCommand('copy');
      if (successful) {
        setLog('Kill-Liste kopiert! [Strg+V bereit]');
        if (state.sound) playClickSound(600);
      } else {
        setLog('Kopieren fehlgeschlagen.');
      }
    } catch (err) {
      setLog('Browser blockiert Zwischenablage.');
    }

    document.body.removeChild(textarea);
  }

  function playClickSound(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  document.addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement.isContentEditable) return;
    if (e.key.toLowerCase() === 'z') undoLast();
  });

  init();
</script>
</body>
</html>
